name: DialogCoinflips
version: 1.0.0
main: com.taho.dialogcoinflips.DialogCoinflips
api-version: '26.1'
depend: [Vault]
softdepend: [floodgate, Geyser-Spigot]
commands:
  cf:
    description: Open coinflips or create a wager
    usage: /cf [create <amount>|cancel]
    aliases: [coinflip, coinflips]
permissions:
  dialogcoinflips.use:
    description: Use the coinflip system
    default: true
